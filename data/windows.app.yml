  - name: Miscellaneous Utilities Application - 應用工具
    id: utilities
    type: folder
    contents:
      - publisher: Microsoft
        name: PowerToys
        cost: free
        id: ms-powertoys
        licenses: [MIT]
        comment: Windows 官方出品，更靈活的視窗佈局、圖片改大小、批量改檔名等一大堆講不完的實用功能。
        note: >
          截止 2025 S4，它支援：
          剪貼簿增強（Advanced Paste）、視窗置頂（Always on Top）、螢幕常亮（Awake）、螢幕取色（Color Picker）、
          命令列找套件（Command Not Found）、新*快速啟動器（Command Palette）、視窗裁剪置頂（Crop and Lock）、
          環境變數編輯器（Environment Variables）、螢幕視窗分區（FancyZones）、
          檔案總管擴充套件（File Explorer Add-ons）、檔案解鎖（File Locksmith）、Host 檔編輯器（Hosts File Editor）、
          批量調整圖像大小（Image Resizer）、鍵盤快捷鍵（Keyboard Manager）、自動切換亮暗主題（Light Switch）、
          滑鼠增強（Mouse Utilities）、軟體 KVM（Mouse Without Borders）、檔案總管「建立」選單增強（New+）、
          檔案總管預覽（Peek）、批量改檔名（PowerRename）、快速啟動器（PowerToys Run）、重音字元輸入（Quick Accent）、
          登錄檔預覽（Registry Preview）、螢幕測量（Screen Ruler）、快速鍵導引（Shortcut Guide）、
          螢幕 OCR（Text Extractor）、工作區管理（Workspaces）、螢幕放大標記錄製（ZoomIt），這麼多的功能。
        links: [{class: homepage, href: "https://docs.microsoft.com/en-us/windows/powertoys/"}]
        install: [{class: winget, content: "winget install -e --id Microsoft.PowerToys"}]
      - publisher: QL-Win
        name: QuickLook
        cost: free
        licenses: [GPL-3.0]
        comment: 類似 Mac 家的 Quick Look 功能：在檔案總管中，按空白鍵快速預覽內容。
        note: 和 PowerToys Peek 差不多，但是功能更強大，支援擴充套件，生態繁盛。
        links: [{class: github, href: "https://github.com/QL-Win/QuickLook"}]
        install: [{class: winget, content: "winget install -e --id QL-Win.QuickLook"}]
      - publisher: Xander Frangos
        name: Twinkle Tray
        cost: free
        licenses: [MIT]
        comment: 調節多個螢幕的亮度。多螢幕必備。
        links:
          - {class: homepage, href: "https://twinkletray.com"}
          - {class: github, href: "https://github.com/xanderfrangos/twinkle-tray"}
        install: [{class: winget, content: "winget install -e --id 9PLJWWSV01LK -s msstore"}]
      - publisher: AntoineAflalo
        name: SoundSwitch
        cost: free
        licenses: [GPL-2.0]
        comment: 一鍵切換喇叭／耳機、麥克風等音訊設備。
        note: "[s]什麼叫做人類只有一對耳朵要那麼多喇叭幹嘛？[/s]"
        links: [{class: homepage, href: "https://github.com/Belphemur/SoundSwitch"}]
        install: [{class: winget, content: "winget install -e --id AntoineAflalo.SoundSwitch"}]
      - publisher: File-New-Project
        name: EarTrumpet
        cost: free
        licenses: [MIT]
        comment: 給軟體指定聲音設備喇叭、控制音量，例如 Spotify 走喇叭、Discord 走耳機……Windows 原生音量控制器的增強版。
        links: [{class: hithub, href: "https://github.com/File-New-Project/EarTrumpet"}]
        install: [{class: winget, content: "winget install -e --id File-New-Project.EarTrumpet"}]
      - publisher: AutoHotkey
        name: AutoHotkey
        cost: free
        licenses: [GPL-2.0]
        tags: [專業]
        comment: 強大的自動化工具，需要程式設計能力。
        links: [{class: homepage, href: "https://devtoys.app/"}]
        install: [{class: winget, content: "winget install -e --id AutoHotkey.AutoHotkey"}]
      - publisher: Dark Byte
