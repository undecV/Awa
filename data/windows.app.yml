        cost: free
        licenses: [GPL-2.0]
        comment: 真正的便利貼，可以置頂在螢幕上。完全本地端，隨用隨丟。
        note: 相比 M$ Sticky Notes 那個綁定在 OneNote 下的便利貼，更加本地優先且快速。
        links: [{class: github, href: "https://github.com/63BeetleSmurf/PinnyNotes"}]
        install: [{class: winget, content: "winget install -e --id 63BeetleSmurf.PinnyNotes"}]
      - publisher: Microsoft
        name: Sticky Notes
        cost: free
        licenses: [Proprietary]
        comment: 便利貼，雖然是獨立應用程式，但是綁定在 OneNote 下，可以跨平臺同步。
        links: [{class: homepage, href: "https://www.onenote.com/"}]
      - publisher: Espanso
        name: Espanso
        cost: free
        licenses: [GPL-3.0]
        comment: 輸入替換，用於快速輸入一些繁雜的內容。例如輸入 [code]:date[/code] 可以替換成當前日期。社群繁盛，有很多已有的替換規則，例如 Emoji，甚至可以 Roll 骰子。
