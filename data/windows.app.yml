        licenses: [GPL-3.0-or-later]
        comment: 快速內容識別（OCR）工具，從圖片中提取文字。框起來，識別，拿走。
        links: [{class: github, href: "https://github.com/TheJoeFin/Text-Grab"}]
        install: [{class: winget, content: "winget install -e --id JosephFinney.Text-Grab"}]
