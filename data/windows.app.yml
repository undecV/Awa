        links:
          - {class: github, href: "https://github.com/jandedobbeleer/oh-my-posh"}
          - {class: homepage, href: "https://ohmyposh.dev/"}
        install: [{class: winget, content: "winget install -e --id JanDeDobbeleer.OhMyPosh"}]
