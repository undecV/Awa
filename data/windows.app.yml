            id: calibre
            cost: free
            licenses: [GPL-3.0]
            comment: 電子書的書櫃。EPUB、漫畫閱讀器。
            links: [{class: homepage, href: "https://calibre-ebook.com/"}]
            install: [{class: winget, content: "winget install -e --id Calibre.Calibre"}]
