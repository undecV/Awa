# yaml-language-server: $schema=../schemas/awa.1.0.0.schema.json

meta: {}
contents:
  - name: Web Browser - 網路瀏覽器
    type: folder
    id: browser
    contents:
      - publisher: Mozilla
        name: Firefox
        comment: 御三家之守序善良。
        note: 我最喜歡的瀏覽器！
        cost: free
        licenses: [MPL-2.0]
        links:
          - {class: homepage, href: "https://www.firefox.com/"}
          - {class: firefox, href: "https://addons.mozilla.org/"}
          - {class: github, href: "https://github.com/mozilla-firefox/firefox"}
        install: [{class: winget, content: "winget install -e --id Mozilla.Firefox"}]
      - publisher: Google
        name: Chrome
        cost: free
        licenses: [Proprietary]
        comment: 御三家之版本解答。
        links:
          - {class: homepage, href: "https://www.google.com/chrome/"}
          - {class: chrome, href: "https://chromewebstore.google.com/"}
        install: [{class: winget, content: "winget install -e --id Google.Chrome"}]
      - publisher: Microsoft
        name: Edge
        cost: free
        licenses: [Proprietary]
        tags: ["內建在 Windows"]
        comment: 御三家之已經內建。
        links: [{class: homepage, href: "https://www.microsoft.com/edge"}]
        install: [{class: winget, content: "winget install -e --id Microsoft.Edge"}]
  - name: Cloud Service - 雲端服務
    type: folder
    id: service
    comment: 是的，常見的雲端服務的 Windows 客戶端都載得到。
    contents:
      - publisher: Telegram
        name: Telegram
        cost: freemium
        licenses: [GPL-3.0-or-later]
        comment: 桀驁不馴的雲端通訊工具。創辦人杜叔 Pavel Durov 因拒絕俄國政府的資料與審查要求離開俄羅斯，Telegram 也一路把隱私、言論與通訊自由當作自己的招牌；從莫斯科一路吵到巴黎，政府找它麻煩幾乎也成了產品特色。
        note: 一般雲端聊天並非端到端加密，只有 Secret Chat 使用 E2EE。
        links: [{class: homepage, href: "https://telegram.org/"}]
        install: [{class: winget, content: "winget install -e --id Telegram.TelegramDesktop"}]
      - publisher: Discord
        name: Discord
        cost: freemium
        licenses: [Proprietary]
        comment: 假裝是語音聊天室的網路社群基礎設施。文字、語音、直播、機器人、論壇全塞進一個 Server 裡。
        links: [{class: homepage, href: "https://discord.com/"}]
        install: [{class: winget, content: "winget install -e --id Discord.Discord"}]
      - publisher: Dropbox
        name: Dropbox
        cost: freemium
        licenses: [Proprietary]
        comment: 把「電腦裡有個資料夾，丟進去就自己同步」這件事做成常識的老牌雲端硬碟。
        links: [{class: homepage, href: "https://www.dropbox.com/"}]
        install: [{class: winget, content: "winget install -e --id Dropbox.Dropbox"}]
      - publisher: Google
        name: Google Drive
        cost: free
        licenses: [Proprietary]
        comment: Google 生態系的雲端硬碟；但不止是存儲，而是和 Docs、Sheets、Slides 等文書分享協作全家桶。
        links: [{class: homepage, href: "https://www.google.com/drive/"}]
        install: [{class: winget, content: "winget install -e --id Google.GoogleDrive"}]
      - publisher: Mega
        name: MegaSync
        cost: freemium
        licenses: [Proprietary]
        comment: 主打隱私與加密的雲端硬碟。[s]什麼，你看到海盜旗了？錯覺啦！[/s]
        links: [{class: homepage, href: "https://mega.io/"}]
        install: [{class: winget, content: "winget install -e --id Mega.MEGASync"}]
  - name: Network - 網路
    type: folder
    id: network
    contents:
      - publisher: Sniffnet
        name: Sniffnet
        cost: free
        licenses: [Apache-2.0, MIT]
        comment: 網路流量監控工具，UI 在好看和好用之間選擇了別具一格；想知道到底是哪個程式正在吃你的網路，可以先從它開始。
        note: 需要 Npcap（的 Wpcap 模式）前置。
        links: [{class: homepage, href: "https://sniffnet.net/"}]
      - publisher: Ashfaaq18
        name: OpenNetMeter
        cost: free
        licenses: [Apache-2.0]
        comment: 網路流量監控工具，介面簡樸，適合常駐後臺。
        links: [{class: github, href: "https://github.com/Ashfaaq18/OpenNetMeter"}]
      - publisher: GlassWire
        name: GlassWire
        cost: freemium
        licenses: [Proprietary]
        comment: 網路流量監視器和防火牆。雖然要錢但是真的好看。
        links: [
          {class: homepage, href: "https://www.glasswire.com/"},
        ]
        install: [{class: winget, content: "winget install -e --id GlassWire.GlassWire"}]
      - name: Downloader - 下載器
        type: folder
        id: downloader
        contents:
        - publisher: aria2
          name: aria2
          cost: free
          tags: [硬核, 命令列工具]
          licenses: [GPL-2.0]
          comment: 多協議命令行下載器，功能強大，高學習成本；但是，用會了就不會再考慮其他下載器了。
          note: 或者，你可以看看用它作為核心的前端。
          links:
            - {class: homepage, href: "https://aria2.github.io/"}
            - {class: github, href: "https://github.com/aria2/aria2"}
          install: [{class: winget, content: "winget install -e --id aria2.aria2"}]
        - publisher: GiantPinkRobots
          name: Varia
          cost: free
          licenses: [MPL-2.0]
          comment: 使用 Aria2 作為核心的下載器，有完整瀏覽器擴充套件支援。
          links:
            - {class: github, href: "https://github.com/giantpinkrobots/varia/"}
          install: [{class: winget, content: "winget install -e --id GiantPinkRobots.Varia"}]
        - publisher: qBittorrent
          name: qBittorrent
          cost: free
          licenses: [GPL-2.0]
          comment: 自由的 BitTorrent 客戶端，擁有可訂製的種子搜尋功能。
          links: [{class: homepage, href: "https://www.qbittorrent.org/"}]
          install: [{class: winget, content: "winget install -e --id qBittorrent.qBittorrent.lt2"}]
        - publisher: JDownloader
          name: JDownloader
          cost: free
          licenses: [GPL-3.0]
          comment: 支援眾多免費空間（免空）的下載器。專治「下載按鈕外面還有八個下載按鈕」的免空。
          note: 下載來路不明的檔案的時候，請務必小心。
          links: [{class: homepage, href: "https://jdownloader.org/"}]
  - name: Remote Access - 遠端存取
    type: folder
    comment: 一臺電腦不夠的話...那就兩臺！
    id: remote
    contents:
      - name: Cross-Device Integration - 跨裝置整合
        id: cross-device
        type: folder
        contents:
        - publisher: KDE
          name: KDE Connect
          cost: free
          licenses: [GPL-3.0]
          comment: 內網下的手機、電腦跨界協作工具，替代內建「手機（Phone Link）」應用。KDE 家族。可以連接電腦和手機，同步通知、傳檔案、遙控器、簡報筆...，甚至連接電腦和電腦、手機和手機。
          links: [{class: homepage, href: "https://kdeconnect.kde.org/"}]
          install: [{class: winget, content: "winget install -e --id KDE.KDEConnect"}]
        - publisher: Genymobile
          name: scrcpy
          cost: free
          tags: [硬核]
          licenses: [Apache-2.0]
          comment: Android -> Windows 螢幕有線、無線投影。建議找一個好用的前端搭配使用。
          links: [{class: github, href: "https://github.com/Genymobile/scrcpy"}]
          install: [{class: winget, content: "winget install -e --id Genymobile.scrcpy"}]
          contents:
            - publisher: viarotel
              name: Escrcpy
              cost: free
              licenses: [GPL-3.0]
              comment: scrcpy 的前端。
              links: [{class: github, href: "https://github.com/viarotel-org/escrcpy"}]
              install: [{class: winget, content: "winget install -e --id viarotel.Escrcpy"}]
        - publisher: LocalSend
          name: LocalSend
          cost: free
          licenses: [Apache-2.0]
          comment: 零配置、可靠的區域網路下跨平臺檔案分享。內網傳檔的版本答案。
          links:
            - {class: homepage, href: "https://localsend.org/"}
            - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/file-transfer-intro/"}
          install: [{class: winget, content: "winget install -e --id LocalSend.LocalSend"}]
        - publisher: Android
          name: Quick Share
          cost: free
          licenses: [Proprietary]
          comment: Android 內建分享工具，現也支援 Windows。
          links:
            - {class: homepage, href: "https://www.android.com/better-together/quick-share-app/"}
            - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/file-transfer-intro/"}
      - name: KVM - 多電腦切換器
        id: remote-kvm
        comment: 用同一套鍵盤、螢幕、滑鼠（Keyboard, Video, Mouse; KVM）控制多臺電腦。
        type: folder
        contents:
        - publisher: Microsoft Garage
          name: Mouse without Borders
          type: reference
          refer: ms-powertoys
          comment: 內網無縫在至多四台的電腦上分享切換一套鍵鼠（Software KVM）。現已加入 PowerToys 全家桶。
          licenses: [Proprietary]
          links: [{class: homepage, href: "https://www.microsoft.com/en-us/download/details.aspx?id=35460"}]
      - name: Remote Desktop - 遠端桌面
        id: remote-desktop
        comment: 在電腦上顯示另外一臺電腦的桌面。
        type: folder
        contents:
        - publisher: uvncbvba
          name: UltraVNC
          cost: free
          licenses: [GPL-3.0]
          comment: 活化石級的 VNC 遠端桌面；介面和年代感都很樸實。但在內網遠端上至今仍然能打。
          links: [{class: homepage, href: "https://uvnc.com/"}]
          install: [{class: winget, content: "winget install -e --id uvncbvba.UltraVNC"}]
        # - publisher: TigerVNC
        #   name: TigerVNC
        #   cost: free
        #   licenses: [GPL-2.0-or-later]
        #   comment: 老牌遠端桌面。
        #   links: [{class: homepage, href: "https://tigervnc.org/"}]
        #   install: [{class: winget, content: "winget install -e --id TigerVNC.TigerVNC"}]
        - publisher: RustDesk
          name: RustDesk
          cost: freemium
          licenses: [AGPL-3.0]
          comment: TeamViewer、AnyDesk 的自由軟體替代品：跨網路、無人值守、檔案傳輸都有，最重要的是連 rendezvous／relay 伺服器都可以自己養。
          note: "[b]預設的設定極不安全。[/b]長期無人值守請務必設定強密碼並檢查存取權限；「裝好就掛著」不是安全設定。"
          links: [{class: homepage, href: "https://rustdesk.com/"}]
          install: [{class: scoop, content: "scoop bucket add extras; scoop install extras/rustdesk"}]
        - publisher: Google
          name: Chrome Remote Desktop
          cost: free
          licenses: [Proprietary]
          tags: [網頁應用]
          comment: 綁上 Google 帳號，幾乎什麼都不用設定就能跨網連上的遠端桌面；非常省腦。
          links:
            - {class: homepage, href: "https://remotedesktop.google.com/"}
            - {class: chrome, href: https://chromewebstore.google.com/detail/chrome-remote-desktop/inomeogfingihgjfjlpeplalcfajhgai}
      - name: Moonlight - 遊戲串流
        id: moonlight
        comment: |
          遊戲串流是在「客戶端」電腦上玩「伺服端」電腦上的遊戲。
        note: NVIDIA GameStream 是被 Nvidia 棄養、又被社群領養變成 Moonlight 的遊戲串流協定。
        type: folder
        contents:
          - publisher: MoonlightGameStreamingProject
            name: Moonlight
            cost: free
            licenses: [GPL-3.0]
            comment: 遊戲串流「客戶端（Client）」裝在要玩的那臺電腦上。
            links:
              - {class: homepage, href: "https://moonlight-stream.org/"}
              - {class: github, href: "https://github.com/moonlight-stream/"}
              - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/make-surface-great-again/sunshine-moonlight-game-streaming/"}
            install: [{class: winget, content: "winget install -e --id MoonlightGameStreamingProject.Moonlight"}]
          - publisher: LizardByte
            name: Sunshine
            cost: free
            licenses: [GPL-3.0]
            comment: 遊戲串流「伺服端（Server）」裝在有遊戲的那臺電腦上。
            links:
              - {class: homepage, href: "http://app.lizardbyte.dev/Sunshine/"}
              - {class: github, href: "https://github.com/LizardByte/Sunshine"}
              - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/make-surface-great-again/sunshine-moonlight-game-streaming/"}
            install: [{class: winget, content: "winget install -e --id LizardByte.Sunshine"}]
          - publisher: Nefarius
            name: HidHide
            cost: free
            licenses: [MIT]
            comment: 本來的用途是遊戲手把裝置防火牆：把實體、虛擬遊戲控制器藏起來，只讓指定軟體看見；專治虛擬和實體手把的衝突。
            note: 內建手把第三方驅動程式，Sunshine 需要它支援手把。
            links:
              - {class: homepage, href: "https://docs.nefarius.at/projects/HidHide/"}
              - {class: github, href: "https://github.com/nefarius/HidHide"}
            install: [{class: winget, content: "winget install -e --id Nefarius.HidHide"}]
          - publisher: VirtualDrivers
            name: Virtual Display Driver
            cost: free
            licenses: [MIT]
            comment: 虛擬顯示器驅動程式。可以憑空變出一台不存在的螢幕，遠端串流想要獨立解析度、HDR 或不想霸佔實體螢幕時非常好用。
            note: Sunshine 可以用它專門搞一個虛擬顯示器。
            links:
              - {class: github, href: "https://github.com/VirtualDrivers/Virtual-Display-Driver"}
              - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/make-surface-great-again/sunshine-moonlight-game-streaming/"}
            install: [{class: winget, content: "winget install -e --id VirtualDrivers.Virtual-Display-Driver"}]
      - name: SSH / FTP - 經典協定
        id: remote-ssh
        type: folder
        comment: 經典的遠端命令列和檔案傳輸協定伺服＼客戶端。
        contents:
        - publisher: WinSCP
          name: WinSCP
          cost: free
          licenses: [GPL-3.0-or-later]
          comment: 經典的 SFTP、FTP、WebDAV、S3、和 SCP 遠端檔案存取客戶端。
          links: [{class: homepage, href: "https://winscp.net/"}]
          install: [{class: winget, content: "winget install -e --id WinSCP.WinSCP"}]
        - publisher: PuTTY
          name: PuTTY
          cost: free
          licenses: [MIT]
          comment: Windows SSH 界的活化石；在 Windows 還不知道 SSH 是什麼的年代，它就已經在幫大家連伺服器了。
          links: [{class: homepage, href: "https://www.chiark.greenend.org.uk/~sgtatham/putty/"}]
          install: [{class: winget, content: "winget install -e --id PuTTY.PuTTY"}]
        - publisher: OpenBSD
          name: OpenSSH
          cost: free
          licenses: [SSH-OpenSSH]
          tags: ["內建在 Windows", "命令列工具"]
          comment: 正統 OpenSSH 如今正式入住 Windows。
          links: [{class: homepage, href: "https://www.openssh.com/"}]
  - name: Audio - 音訊
    id: audio
    comment: 我知道現在是串流音樂的時代了，但…
    type: folder
    contents:
      - publisher: PeterPawlowski
        name: foobar2000
        cost: free
        tags: [硬核]
        licenses: [Proprietary]
        comment: 本地音樂播放器界的樂高；剛裝好的介面樸素得像半成品，調教完成後則可以長成完全屬於你的播放器。
        links: [{class: homepage, href: "https://www.foobar2000.org/"}]
        install: [{class: winget, content: "winget install -e --id PeterPawlowski.foobar2000"}]
      - publisher: AIMP
        name: AIMP
        cost: free
        licenses: [Proprietary]
        comment: Winamp 的精神後繼，傳統本地音樂播放器，功能完整、介面正常，而且真的還可以換皮。
        links: [{class: homepage, href: "https://aimp.ru/"}]
        install: [{class: winget, content: "winget install -e --id AIMP.AIMP"}]
      - publisher: Audacity
        name: Audacity
        cost: free
        tags: [專業]
        licenses: [GPL-3.0-or-later]
        comment: 錄音、剪接、降噪、效果處理。需要剪一段聲音又想從車庫裏面搬出整套 DAW 時，通常就是它。
        links: [{class: homepage, href: "https://www.audacityteam.org/"}]
        install: [{class: winget, content: "winget install -e --id Audacity.Audacity"}]
      - publisher: VB-Cable
        name: Voicemeeter
        cost: free
        tags: [專業]
        licenses: [Proprietary]
        comment: 把 Windows 裡原本各走各路的麥克風、喇叭和軟體音訊全部拉進一張虛擬混音台；直播、錄影、語音聊天想要「這個聲音送這裡，那個聲音不要送那裡」時非常好用。
        links: [{class: homepage, href: "https://www.voicemeeter.com/"}]
        install: [{class: winget, content: "winget install -e --id VB-Audio.Voicemeeter"}]
      - publisher: Jackaudio
        name: JACK2
        cost: free
        tags: [專業]
        licenses: [GPL-2.0]
        comment: 專業的音訊伺服器。把電腦裡的音訊裝置和程式全部當成可以拔插的虛擬音源線；非常專業，也非常容易讓第一次打開的人懷疑人生。
        links:
        - {class: homepage, href: "https://jackaudio.org/downloads/"}
        - {class: github, href: "https://github.com/jackaudio/jack2"}
        install: [{class: winget, content: "winget install -e --id Jackaudio.JACK2"}]
  - name: Video - 視訊
    id: video
    comment: 我知道現在是串流影片的時代了，但…
    type: folder
    contents:
      - publisher: mpv
        name: mpv
        cost: free
        tags: [硬核]
        licenses: [GPL-2.0]
        comment: 超強大播放器[b]核心[/b]。需要外掛讓你便利使用。
        note: 或者你可以找一些以 mpv 做爲後端的成品播放器。
        links:
          - {class: homepage, href: "https://mpv.io/"}
          - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/make-surface-great-again/mpv-touch-gestures/"}
        install: [{class: scoop, content: "scoop install extras/mpv"}]
        contents:
          - publisher:  tomasklaen
            name: uosc
            cost: free
            licenses: [LGPL-2.1]
            comment: mpv 的 OSC 視覺增強外掛。
            links: [{class: github, href: "https://github.com/tomasklaen/uosc"}]
      - publisher: CodecGuide
        name: K-Lite Codec Pack
        cost: free
        licenses: [Proprietary]
        comment: 老當益壯 MPC-HC 播放器和眾多解碼器幫你蒐集整併好的全家桶。
        note: 大多組件開源。
        links: [{class: homepage, href: "http://www.codecguide.com/"}]
        install: [{class: winget, content: "winget install -e --id CodecGuide.K-LiteCodecPack.Mega"}]
      - publisher: VideoLAN
        name: VLC
        cost: free
        licenses: [GPL-2.0]
        comment: 跨平臺播放器，支持串流，支持換外觀。格式奇怪、來源奇怪、甚至是網路串流，它多半都願意試著播給你看。
        links: [{class: homepage, href: "https://www.videolan.org/vlc/"}]
        install: [{class: winget, content: "winget install -e --id VideoLAN.VLC"}]
      - publisher: Ruffle
        name: Ruffle
        cost: free
        licenses: [Apache-2.0, MIT]
        comment: Adobe Flash (SWF) 播放器，用現代技術重新實作 Flash Player，專門搶救網路考古遺跡。
        links:
          - {class: homepage, href: "https://ruffle.rs/"}
          - {class: github, href: "https://github.com/ruffle-rs/ruffle"}
        install: [{class: winget, content: "winget install -e --id Ruffle.Ruffle.Nightly"}]
      # - publisher: RyanYuuki
      #   name: AnymeX
      #   cost: free
      #   licenses: [MIT]
      #   comment: 動畫、動漫、漫畫、輕小說的資訊聚合器。
      #   links: [{class: github, href: "https://github.com/RyanYuuki/AnymeX"}]
      #   install: [{class: winget, content: "winget install -e --id RyanYuuki.AnymeX"}]
      - name: Video Editing - 影片編輯
        id: video-editing
        type: folder
        contents:
          - publisher: OBS Project
            name: OBS Studio
            cost: free
            tags: [專業]
            licenses: [GPL-2.0]
            comment: 實況、直播串流與螢幕錄製的事實標準：場景、來源、混音、編碼、插件一應俱全，從個人直播到大型活動都靠它撐場。
            links: [{class: homepage, href: "https://obsproject.com/"}]
            install: [{class: winget, content: "winget install -e --id OBSProject.OBSStudio"}]
          - publisher: KDE
            name: Kdenlive
            cost: free
            licenses: [GPL-3.0]
            comment: KDE 家族的正規非線性剪輯（NLE）工作站。真的可以拿來學剪輯的軟體。
            note: "[s]記得頻繁存檔，不要問我怎麼知道的。[/s]"
            links: [{class: homepage, href: "https://community.kde.org/Kdenlive"}]
            install: [{class: winget, content: "winget install -e --id KDE.Kdenlive"}]
          - publisher: Shotcut
            name: Shotcut
            cost: free
            licenses: [GPL-3.0]
            comment: 跨平臺非線性剪輯（NLE）工作站。
            links: [{class: homepage, href: "https://shotcut.org/"}]
            install: [{class: winget, content: "winget install -e --id Meltytech.Shotcut"}]
          - publisher: BlenderFoundation
            name: Blender
            type: reference
            refer: blenderfoundation-blender
            comment: 是的你沒看錯，3D 軟體可以剪輯影片。
          - publisher: Avidemux
            name: Avidemux
            cost: free
            tags: [專業]
            licenses: [GPL-2.0]
            comment: 自稱以簡單處理方法製作影片的簡單工具，實測確實就像用手機內建的影片編輯器一樣（*2026）簡單。
            links: [{class: homepage, href: http://avidemux.sourceforge.net"}]
            install: [{class: winget, content: "winget install -e --id Avidemux.Avidemux"}]
          - publisher: Aegisub
            name: Aegisub
            cost: free
            tags: [專業]
            licenses: [GPL-2.0]
            comment: 字幕編輯器。字幕組祖傳兵器。時間軸、樣式、定位、ASS 特效都能精修，動畫字幕看到的各種花活特效很多都是從這類工具裡長出來的。
            links: [{class: homepage, href: "https://aegisub.org/"}]
            install: [{class: winget, content: "winget install -e --id Aegisub.Aegisub"}]
          - publisher: MoritzBunkus
            name: MKVToolNix
            cost: free
            tags: [專業]
            licenses: [GPL-2.0]
            comment: MKV、WEBM 的打包解包工具。影片、音軌、字幕、章節都可以拆開、換掉再重新封回去，而且不用重新編碼。
            links: [{class: homepage, href: "https://mkvtoolnix.download/"}]
            install: [{class: winget, content: "winget install -e --id MoritzBunkus.MKVToolNix"}]
          - publisher: HandBrake
            name: HandBrake
            cost: free
            tags: [專業]
            licenses: [GPL-2.0]
            comment: 影片轉檔、轉碼工具。想要轉檔影片又不想先修一學期編解碼器的話就從這裡開始。
            links: [{class: homepage, href: "https://handbrake.fr/"}]
            install: [{class: winget, content: "winget install -e --id HandBrake.HandBrake"}]
          # - publisher: Maruko
          #   name: Maruko Toolbox
          #   cost: free
          #   tags: [Deprecated, 專業]
          #   licenses: [Proprietary]
          #   comment: 小丸工具箱。簡單易用的影片編解碼工具。
          #   links: [{class: homepage, href: "http://maruko.appinn.me/"}]
  - name: Image - 圖像
    id: image
    comment: 我知道現在內建的圖片檢視器已經很好用了，但…
    type: folder
    contents:
      - publisher: ImageMagick
        name: ImageMagick
        cost: free
        tags: [專業, 命令列工具]
        licenses: [ImageMagick]
        comment: 用指令玩圖片。裁切、縮放、轉格式、合成、批次處理，甚至讓 AI 教你怎麼把圖片「剪輯成 GIF」這些任務，ImageMagick 都是不二之選。
        note: 其實算是開源，只是沒有 OSI 和 FSF 的開源自由小金標。通常是被其他軟體需要。
        links: [{class: homepage, href: "https://imagemagick.org/"}]
        install: [{class: winget, content: "winget install -e --id ImageMagick.ImageMagick"}]
      - publisher: OliverBetz
        name: ExifTool
        cost: free
        tags: [專業, 命令列工具]
        licenses: [GPL-3.0-or-later]
        comment: 查看和編輯圖片的 Exif、IPTC、XMP 等元資料。
        links: [{class: homepage, href: "https://exiftool.org/"}]
        install: [{class: winget, content: "winget install -e --id OliverBetz.ExifTool"}]
      - publisher: Microsoft
        name: Windows Photo Viewer
        cost: free
        licenses: [Proprietary]
        tags: ["內建在 Windows"]
        comment: Windows 內建的圖片檢視器，其實已經很好用了，內建轉檔和編輯等功能。
        note: 要看（例如 iPhone 拍出來的）HEIC 要課（真的一點點）金買 HEIF Image Extension。
        links: [{class: homepage, href: "https://www.microsoft.com/en-us/download/details.aspx?id=35825"}]
      # - publisher: DuongDieuPhap
      #   name: ImageGlass
      #   cost: free
      #   licenses: [GPL-3.0]
      #   comment: 更漂亮、更能幹的圖片瀏覽器。
      #   note: 有捆綁前科。
      #   links: [{class: homepage, href: "https://imageglass.org/"}]
      #   install: [{class: winget, content: "winget install -e --id DuongDieuPhap.ImageGlass"}]
      - publisher: nomacs
        name: nomacs
        cost: free
        licenses: [GPL-3.0]
        comment: 圖片檢視器該有的樣子，安靜、輕量、沒有太多戲；介面不複雜也還算端莊，支援衆多格式。
        links:
          - {class: homepage, href: "https://nomacs.org/"}
          - {class: github, href: "https://github.com/nomacs/nomacs"}
        install: [{class: winget, content: "winget install -e --id nomacs.nomacs"}]
      - publisher: IrfanSkiljan
        name: IrfanView
        cost: free
        licenses: [GPL-3.0]
        comment: Windows 圖片工具界另一塊活化石：醜得非常有效率，小得不像現代軟體，卻能看、轉、批次處理一大票格式。
        links: [{class: homepage, href: "https://www.irfanview.com/"}]
        install: [{class: winget, content: "winget install -e --id IrfanSkiljan.IrfanView"}]
        contents:
          - publisher: IrfanSkiljan
            name: IrfanView Plugins
            cost: free
            licenses: [GPL-3.0]
            comment: IrfanView 的外掛。
            links: [{class: homepage, href: "https://www.irfanview.com/plugins.htm"}]
            install: [{class: winget, content: "winget install -e --id IrfanSkiljan.IrfanViewPlugins"}]
      - publisher: KDE
        name: digiKam
        cost: free
        licenses: [GPL-2.0-or-later]
        comment: 本地端照片管理器。KDE 家族。開源世界的 ACDSee 和 Picasa。相簿、標籤、Metadata、搜尋、批次整理、……。照片一多就知道它為什麼存在。
        links: [{class: homepage, href: "https://www.digikam.org/"}]
        install: [{class: winget, content: "winget install -e --id KDE.digiKam"}]
      - publisher: Immich
        name: Immich
        cost: free
        licenses: [AGPL-3.0]
        tags: [自建置]
        comment: 自建置照片雲端管理器。開源世界的 Google Photos。跨平臺。
        note: 託管的機器要有足夠的儲存空間：）
      - publisher: BenHollis
        name: PNG Gauntlet
        cost: free
        tags: [Deprecated]
        licenses: [Proprietary]
        comment: PNG 圖片無損壓縮工具，在不損失畫質的前提下減小檔案大小，支援批次處理。
        links: [{class: homepage, href: "https://pnggauntlet.com/"}]
        install: [{class: winget, content: "winget install -e --id BenHollis.PNGGauntlet"}]
      - publisher: Amin Ahmadi
        name: Perspective Cropper
        cost: free
        licenses: [Proprietary]
        comment: 透視變化來裁剪圖像。就是定位四個角點然後拉直。
        links: [{class: homepage, href: "https://amin-ahmadi.com/perspective-cropper/"}]
      - name: Screenshot - 螢幕截圖
        id: screenshot
        type: folder
        contents:
        - publisher: Flameshot
          name: Flameshot
          cost: free
          licenses: [GPL-3.0]
          comment: 小巧簡單快速但是功能豐富的，開源、跨平台的進階截圖工具，支援即時標註、模糊、貼圖（Pin）與高度自訂。
          links: [{class: homepage, href: "https://flameshot.org"}]
          install: [{class: winget, content: "winget install -e --id Flameshot.Flameshot"}]
        - publisher: ShareX
          name: ShareX
          cost: free
          licenses: [GPL-3.0]
          comment: 截圖、編輯、分享流水線式一鍵完成，介面複雜也功能強大。
          links: [{class: homepage, href: "https://getsharex.com/"}]
          install: [{class: winget, content: "winget install -e --id ShareX.ShareX"}]
        - publisher: BahraniApps
          name: GifCam
          cost: free
          licenses: [Proprietary]
          comment: 無需安裝的小巧 GIF 錄屏、編輯工具。
          links: [{class: homepage, href: "http://blog.bahraniapps.com/gifcam/"}]
      - name: Comic Reader - 漫畫閱讀器
        id: comic
        comment: 「漫畫」就是打包在一個壓縮檔裏面有一拖拉庫的圖片檔。
        type: folder
        contents:
          - publisher: neelabo
            name: NeeView
            cost: free
            licenses: [MIT]
            comment: 全功能漫畫閱讀器，觸控螢幕友善。
            links: [{class: github, href: "https://github.com/neelabo/NeeView"}]
            install: [{class: winget, content: "winget install -e --id neelabo.NeeView"}]
          - publisher: YACReader
            name: YACReader
            cost: free
            licenses: [GPL-3.0]
            comment: 漫畫閱讀、管理器。漫畫書櫃。
            links: [{class: homepage, href: "https://www.yacreader.com/"}]
            install: [{class: winget, content: "winget install -e --id YACReader.YACReader"}]
          - publisher: SumatraPDF
            name: SumatraPDF
            type: reference
            refer: sumatrapdf
            comment: 也可以看漫畫，觸控螢幕友好。
          - publisher: Calibre
            name: Calibre
            type: reference
            refer: calibre
            comment: 也可以看漫畫。但主要是電子書的思路。
  - name: Creation - 創作
    id: creation
    type: folder
    contents:
      - publisher: Adobe
        name: Adobe 全家桶
        cost: paid
        tags: [全家桶, 專業]
        flags: [set]
        licenses: [Proprietary]
        comment: 業界標準，天價收費。
        links: [{class: homepage, href: "http://www.adobe.com/"}]
      - publisher: BlenderFoundation
        name: Blender
        id: blenderfoundation-blender
        cost: free
        tags: [專業]
        licenses: [GPL-3.0-or-later]
        comment: 自由軟體世界的傳奇之一：從建模、雕刻、材質、動畫、模擬、渲染、合成，到剪輯影片，幾乎整條 3D 製作管線都敢自己包辦；曾經靠社群眾籌贖身，如今是堂堂正正的專業 3D 工具第一線。
        note: "[s]你只是想剪個影片？很好，我們先來理解一下什麼叫 Scene……[/s]"
        links: [{class: homepage, href: https://www.blender.org/}]
        install: [{class: winget, content: "winget install -e --id BlenderFoundation.Blender"}]
      - publisher: Figma
        name: Figma
        cost: freemium
        tags: [專業]
        licenses: [Proprietary]
        comment: 雲端協作的 UI/UX 設計工具，也可以做平面設計。
        links: [{class: homepage, href: https://www.figma.com/}]
        install: [{class: winget, content: "winget install -e --id Figma.Figma"}]
      - publisher: Darktable
        name: Darktable
        cost: free
        tags: [專業]
        licenses: [GPL-3.0]
        comment: 「沖洗相片」，編輯相片的曝光、色彩及其他細節。自由軟體界的 Adobe Lightroom。
        links: [{class: homepage, href: "https://www.darktable.org/"}]
        install: [{class: winget, content: "winget install -e --id darktable.darktable"}]
      - publisher: GIMP
        name: GIMP
        cost: free
        tags: [專業]
        licenses: [GPL-3.0-or-later]
        comment: 點陣圖編輯軟體，自由軟體界的 Adobe Photoshop。
        links: [{class: homepage, href: "https://www.gimp.org/"}]
        install: [{class: winget, content: "winget install -e --id GIMP.GIMP.3"}]
      - publisher: Inkscape
        name: Inkscape
        cost: free
        tags: [專業]
        licenses: [GPL-3.0-or-later]
        comment: 矢量圖編輯軟體，自由軟體界的 Adobe Illustrator 或 CorelDRAW。
        links: [{class: homepage, href: "https://inkscape.org/"}]
        install: [{class: winget, content: "winget install -e --id Inkscape.Inkscape"}]
      - publisher: KDE
        name: Krita
        cost: free
        tags: [專業]
        licenses: [GPL-3.0]
        comment: KDE 家族的繪圖軟體，自由軟體界的 PaintTool SAI。
        links: [{class: homepage, href: "https://krita.org/"}]
        install: [{class: winget, content: "winget install -e --id KDE.Krita"}]
  - name: Embellish and Easy Access - 美化和便捷使用
    id: embellish
    type: folder
    contents:
      - publisher: Wallpaper Engine Team
        name: Wallpaper Engine
        cost: paid
        licenses: [Proprietary]
        comment: "[s]整個桌布都是我的播放器，[/s]可高度客製化的動態桌布。"
        links:
         - {class: homepage, href: "https://www.wallpaperengine.io"}
         - {class: steam, href: "http://store.steampowered.com/app/431960/Wallpaper_Engine/"}
      - publisher: MacroDeck
        name: MacroDeck
        cost: free
        licenses: [Apache-2.0]
        comment: 讓任何觸控螢幕設備變成像是 Elgato Stream Deck 一樣的巨集鍵盤。
        links: [{class: homepage, href: "https://macro-deck.app/"}]
        install: [{class: winget, content: "winget install -e --id MacroDeck.MacroDeck"}]
      - publisher: SSP
        name: SSP
        cost: free
        licenses: [Proprietary]
        comment: 偽春菜（伺か）引擎。讓可愛的靈魂在桌面的一角陪伴你。
        links: [{class: homepage, href: "https://ssp.shillest.net/"}]
      - publisher: Rainmeter
        name: Rainmeter
        cost: free
        licenses: [GPL-2.0]
        comment: 從時鐘、系統監控、天氣、音樂控制，到把整個桌面改造成科幻 HUD，只要有人願意寫 Skin，它幾乎什麼都能往桌面上掛。十幾年來養出龐大的主題與插件生態，也讓無數人第一次知道「原來 Windows 桌面可以不是 Windows 的樣子」。
        note: "[s]然後你花三個小時調好一套桌面，隔天發現自己其實只需要看時間，發現右下角已經有了。[/s]"
        links: [{class: homepage, href: "https://www.rainmeter.net/"}]
        install: [{class: winget, content: "winget install -e --id Rainmeter.Rainmeter"}]
      - publisher: code52
        name: Carnac
        cost: free
        licenses: [MS-PL]
        comment: 在屏幕上顯示鍵盤輸入。便於螢幕錄製展示操作。
        links: [{class: github, href: "https://github.com/Code52/carnac"}]
        install: [{class: winget, content: "winget install -e --id code52.Carnac"}]
  - name: Files - 檔案處理
    id: files
    type: folder
    contents:
      - publisher: FilesCommunity
        name: Files
        cost: free
        licenses: [MIT]
        comment: 真正現代的檔案總管。如果再給 Microslop 一次機會，檔案總管大概就會長成這個樣子。
        note: 但就是現在用起來還有點慢慢卡卡，他們還在持續努力優化，未來相當的值得期待。
        links: [{class: homepage, href: "https://files.community/",}]
        install: [{class: winget, content: "winget install -e --id FilesCommunity.Files"}]
      - publisher: KDE
        name: Dolphin
        cost: free
        licenses: [GPL-2.0-or-later]
        comment: KDE 家族的檔案總管。是的你可以在 Windows 上用 KDE 的檔案總管。這倒反天罡的感覺就像在麥當勞裡點到摩斯漢堡。
        note: 這可能是 KDE 家族在秀肌肉，但目前沒有對應 Windows 特化的整合，所以目前僅供娛樂。
        links: [{class: homepage, href: "https://apps.kde.org/zh-tw/dolphin/"}]
        install: [{class: winget, content: "winget install -e --id KDE.Dolphin"}]
      - publisher: Syncthing
        name: Syncthing
        cost: free
        licenses: [MPL-2.0]
        comment: 裝在兩臺設備上就可以檔案異地同步。含有簡單的版本管理可以當檔案備份用。不需要雲端服務器，資料不會被第三方看到。
        links: [{class: homepage, href: "https://syncthing.net/"}]
        install: [{class: winget, content: "winget install -e --id Syncthing.Syncthing"}]
      - publisher: UderzoSoftware
        name: SpaceSniffer
        cost: free
        licenses: [Proprietary]
        comment: 以「矩形式樹狀結構繪圖法」檢視硬碟佔用空間分佈。一眼找出到底是哪個資料夾吃掉了硬碟空間。
        links: [{class: homepage, href: "http://www.uderzo.it/main_products/space_sniffer/index.html",}]
        install: [{class: winget, content: "winget install -e --id UderzoSoftware.SpaceSniffer"}]
      - publisher: WinMerge
        name: WinMerge
        cost: free
        licenses: [GPL-2.0]
        comment: 檔案、資料夾比較、差分、同步。「這兩個東西到底哪裡不一樣」。
        links: [{class: homepage, href: "https://winmerge.org/"}]
        install: [{class: winget, content: "winget install -e --id WinMerge.WinMerge"}]
      - publisher: KDE
        name: KDiff3
        cost: free
        licenses: [GPL-2.0-or-later]
        comment: KDE 家族出品的檔案、資料夾比較、差分。
        links: [{class: homepage, href: "https://apps.kde.org/zh-tw/kdiff3/"}]
        install: [{class: winget, content: "winget install -e --id KDE.KDiff3"}]
      - publisher: DupeGuru
        name: dupeGuru
        cost: free
        licenses: [GPL-3.0-or-later]
        comment: 專門找到那些名字不同、位置不同，內容其實一模一樣的重複檔案。
        links: [{class: homepage, href: "https://dupeguru.voltaicideas.net",}]
        install: [{class: winget, content: "winget install -e --id DupeGuru.DupeGuru"}]
      - publisher: HulubuluSoftware
        name: Advanced Renamer
        cost: freemium
        licenses: [Proprietary]
        comment: 高級的檔案批次重新命名工具。可以用各種規則和檔案的 Metadata 來重新命名檔案。
        note: 免費版本功能已經很強大了。
        links: [{class: homepage, href: "https://dupeguru.voltaicideas.net",}]
        install: [{class: winget, content: "winget install -e --id HulubuluSoftware.AdvancedRenamer"}]
      - publisher: FastCopy
        name: FastCopy
        cost: freemium
        licenses: [Proprietary]
        comment: 高速檔案複製、移動工具。雖然介面像是操作精密儀器，但是加速效果顯著。適合跨硬碟拷貝大檔案的情況。
        links: [{class: homepage, href: "https://fastcopy.jp/en/"}]
        install: [{class: winget, content: "winget install -e --id FastCopy.FastCopy"}]
      - publisher: Microsoft
        name: Robocopy
        cost: free
        tags: [內建在 Windows, 命令列工具]
        licenses: [Proprietary]
        comment: Windows 內建的重型檔案搬運工具：續傳、多執行緒、重試、鏡像、權限與紀錄樣樣都有，特別適合配合腳本程式和大量資料搬遷。
        links: [{class: homepage, href: "https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/robocopy"}]
      - name: Compression - 檔案壓縮
        id: compression
        type: folder
        contents:
          - publisher: 7-Zip
            name: 7-Zip
            cost: free
            licenses: [LGPL-2.1]
            comment: 檔案壓縮，本家格式 [code]7z[/code]，較高壓縮率。介面古老到樸實無華，但基本上你丟什麼壓縮檔給它都願意拆。
            links: [{class: homepage, href: "http://www.7-zip.org/"}]
            install: [{class: winget, content: "winget install -e --id 7zip.7zip"}]
          - publisher: RARLab
            name: WinRAR
            cost: freemium
            licenses: [Proprietary]
            comment:  檔案壓縮，本家格式 [code]RAR[/code]，賣點是已經被廣泛用到漫天橫飛，以及可添加內置的恢復用冗餘。
            note: "[s]其實不要錢也能用。[/s]"
            links: [{class: homepage, href: "http://www.rarlab.com/",}]
            install: [{class: winget, content: "winget install -e --id RARLab.WinRAR"}]
          - publisher: Giorgiotani
            name: PeaZip
            cost: free
            licenses: [LGPL-3.0]
            comment: 檔案壓縮，多格式支持。具備文字編碼轉換能力（防止解壓縮亂碼）。
            links: [{class: homepage, href: "http://www.peazip.org/",}]
            install: [{class: winget, content: "winget install -e --id Giorgiotani.Peazip"}]
          - publisher: Bandisoft
            name: Bandizip
            cost: freemium
            licenses: [Proprietary]
            tags: [彈窗廣告]
            comment: 檔案壓縮，多格式支持，方便的文字編碼轉換（防止解壓縮亂碼）。介面簡潔實用。付費版可以去除彈窗廣告，以及自動填寫密碼等的功能。
            note: "v7 新版本免費版添加首次開啓時的廣告，[s]（建議課金享受）[/s]。"
            links: [{class: homepage, href: "https://www.bandisoft.com/",}]
            install: [{class: winget, content: "winget install -e --id Bandisoft.Bandizip"}]
      - name: Desktop Search / Launcher - 桌面搜尋／起動器
        id: launcher
        type: folder
        contents:
          - publisher: voidtools
            name: Everything
            cost: free
            licenses: [MIT]
            comment: 超高速檔案搜尋。原來 Windows 搜尋不必這麼慢。在建立索引後幾乎是即時搜尋。
            note: 被諸多軟體用來做檔案搜尋的後端，可以說是必備神器。
            links: [{class: homepage, href: "https://www.voidtools.com/"}]
            install: [{class: winget, content: "winget install -e --id voidtools.Everything"}]
            contents:
              - publisher: voidtools
                name: Everything CLI
                cost: free
                licenses: [MIT]
                comment: 指令版本的 Everything，通常被其他軟體需要。
                links: [{class: homepage, href: "https://www.voidtools.com/"}]
                install: [{class: winget, content: "winget install -e --id voidtools.Everything.Cli"}]
              - publisher: stnkl
                name: EverythingToolbar
                cost: free
                licenses: [MIT]
                comment: 把 Everything 放到工作列上，可以取代內建的搜尋。
                links: [{class: github, href: "https://github.com/stnkl/EverythingToolbar"}]
          - publisher: Pyonkichi
            name: CLaunch
            cost: free
            licenses: [Proprietary]
            comment: 圖標式啟動器。把常用程式、檔案、資料夾整理成一頁頁按鈕，再用熱鍵、滑鼠手勢或桌面角落瞬間叫出來。支援外觀主題，現在看都不過時。
            links:
              - {class: homepage, href: "https://ss1.xrea.com/pyonkichi.g1.xrea.com/en/claunch.html"}
              - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/desktop-search-and-claunch-zh-tw/"}
            install: [{class: winget, content: "winget install -e --id Pyonkichi.CLaunch"}]
          - publisher: OliverSchwendener
            name: Ueli
            cost: free
            licenses: [MIT]
            comment: Spotlight 類型的搜尋式啟動器。用 `Alt+Space` 叫出來，開始打字就搜程式、檔案、瀏覽器書籤，還能計算、做單位／貨幣轉換。
            links:
              - {class: homepage, href: "https://ueli.app"}
              - {class: github, href: "https://github.com/oliverschwendener/ueli"}
              - {class: site, content: 本站介紹, href: "https://undecv.github.io/blog/posts/desktop-search-and-claunch-zh-tw/"}
            install: [{class: winget, content: "winget install -e --id OliverSchwendener.ueli"}]
  - name: Security - 安全
    id: security
    type: folder
    contents:
      - publisher: GnuPG
        name: Gpg4win
        cost: free
        licenses: [GPL-2.0]
        comment: 密碼學軟體禮盒版。用公／私密鑰建立、管理、驗證、簽署、加密文字、檔案和郵件。
        links: [{class: homepage, href: "https://gpg4win.org/",}]
        install: [{class: winget, content: "winget install -e --id GnuPG.Gpg4win"}]
      - publisher: IDRIX
        name: VeraCrypt
        cost: free
        licenses: [Apache-2.0]
        comment: 磁碟／分割區／虛擬分割區加密，TrueCrypt 的傳承者。
        links: [{class: github, href: "https://github.com/veracrypt/VeraCrypt"}]
        install: [{class: winget, content: "winget install -e --id IDRIX.VeraCrypt"}]
      - publisher: Eraser
        name: Eraser
        cost: free
        licenses: [GPL-3.0-or-later]
        comment: 國家安全等級的徹底地擦除檔案。（普通刪除是把檔案從目錄上劃掉假裝它不存在，用覆寫的方式讓「刪除」比較接近真的刪除，做到難以恢復。）
        links: [{class: homepage, href: "https://eraser.heidi.ie/"}]
        install: [{class: winget, content: "winget install -e --id Eraser.Eraser"}]
      - publisher: Oracle
        name: VirtualBox
        cost: free
        licenses: [GPL-3.0-only]
        tags: [專業]
        comment: 桌面虛擬機。如果想在電腦裡再養幾臺電腦的話。
        links: [{class: homepage, href: "https://www.virtualbox.org/"}]
        install: [{class: winget, content: "winget install -e --id Oracle.VirtualBox"}]
      - publisher: KeePassXCTeam
        name: KeePassXC
        cost: free
        licenses: [GPL-2.0-or-later]
        comment: 離線密碼管理器。沒有雲端、沒有帳號、沒有訂閱，只有一個你自己保管的加密資料庫；需要時再配瀏覽器外掛自動填入。
        links: [{class: homepage, href: "https://keepassxc.org/"}]
        install: [{class: winget, content: "winget install -e --id KeePassXCTeam.KeePassXC"}]
      - publisher: Bitwarden
        name: Bitwarden
        cost: freemium
        licenses: [GPL-3.0-or-later]
        comment: 開源、跨平臺雲端密碼管理器。免費版就能滿足大部分需求。瀏覽器、桌面、手機、CLI 全都有。也可以自己架伺服器。
        note: （*2026）長期接受外部審計。社群接受度較高。
        links: [{class: homepage, href: "https://bitwarden.com/"}]
        install: [{class: winget, content: "winget install -e --id Bitwarden.Bitwarden"}]
      - publisher: Mullvad
        name: Mullvad VPN
        cost: paid
        licenses: [GPL-3.0]
        tags: [服務]
        comment: 提供 VPN 服務，把「我不想讓 VPN 公司知道我是誰」貫徹得近乎偏執的 VPN；甚至不需要提供郵箱。產品哲學比行銷話術更有存在感。
        note: 據說是 Mozilla VPN 的供應商。官方網站甚至提供了一些網路安全隱私的教育資源。
        links: [{class: homepage, href: "https://mullvad.net/"}]
      - publisher: WireGuard
        name: WireGuard
        cost: free
        licenses: [MIT]
        tags: [專業]
        comment: 虛擬網卡和自建置虛擬私人網路。當代重新設計，配置極簡、速度極快。
        links: [{class: homepage, href: "https://www.wireguard.com/"}]
        install: [{class: winget, content: "winget install -e --id WireGuard.WireGuard"}]
      - publisher: OpenVPNTechnologies
        name: OpenVPN
        cost: free
        licenses: [GPL-2.0]
        tags: [專業]
        comment: 虛擬網卡和自建置虛擬私人網路。成熟、可配置，設定也非常成熟。
        links: [{class: homepage, href: "https://openvpn.net/community-downloads/"}]
        install: [{class: winget, content: "winget install -e --id OpenVPNTechnologies.OpenVPN"}]
      - publisher: WiresharkFoundation
        name: Wireshark
        cost: free
        licenses: [GPL-2.0]
        tags: [專業]
        comment: 網路分析工具。♬如果你願意一層一層一層一層地剝開你的網路封包，你會發現你會訝異你的網路最壓抑最深處的秘密……♬
        links: [{class: homepage, href: "https://www.wireshark.org/"}]
        install: [{class: winget, content: "winget install -e --id WiresharkFoundation.Wireshark"}]
      - publisher: PortSwigger
        name: Burp Suite
        cost: freemium
        licenses: [Proprietary]
        tags: [專業]
        comment: 網路安全測試工具。
        note: "[s]非專業人士請勿輕易嘗試！[/s]"
        links: [{class: homepage, href: "https://portswigger.net/burp"}]
        install: [{class: winget, content: "winget install -e --id PortSwigger.BurpSuite.Community"}]
      - publisher: Insecure
        name: Nmap
        cost: free
        licenses: [GPL-2.0]
        tags: [專業]
        comment: 網路偵察工具。可以掃描網路上有哪些主機、哪些服務、哪些漏洞。
        note: "[s]非專業人士請勿輕易嘗試！[/s]"
        links: [{class: homepage, href: "https://nmap.org/"}]
        install: [{class: winget, content: "winget install -e --id Insecure.Nmap"}]
      - publisher: Insecure
        name: Npcap
        cost: free
        id: insecure-npcap
        licenses: [Proprietary]
        tags: [專業]
        comment: 擷取網路流量的工具。
        note: 通常是被別的軟體需要。
        links: [{class: homepage, href: "https://npcap.com/"}]
      - publisher: MrKaran
        name: Doggo
        cost: free
        licenses: [GPL-3.0-or-later]
        comment: 用 Go-lang 寫的 [code]dig[/code]， DNS 分析工具。
        links: [{class: github, href: "https://github.com/mr-karan/doggoge"}]
        install: [{class: winget, content: "winget install -e --id MrKaran.Doggo"}]
  - name: Office - 辦公室／文書處理
    id: office
    type: folder
    contents:
      - publisher: Mozilla
        name: Thunderbird
        cost: free
        licenses: [MPL-2.0]
        comment: 與 Firefox 師出同門 Mozilla 的老牌電子郵件軟體，在一個地方管理多個郵箱、RSS 訂閱、日曆、任務。
        note: 確實還在快步追趕新時代。（*2026）已經官方支援 MS Exchange 協定了。
        links: [{class: homepage, href: "https://www.thunderbird.net/"}]
        install: [{class: winget, content: "winget install -e --id Mozilla.Thunderbird"}]
      - publisher: TheDocumentFoundation
        name: LibreOffice
        cost: free
        licenses: [MPL-2.0]
        comment: 辦公室軟體套件。文檔、試算表、投影片、公式、圖表、資料庫。自由軟體界的 M$ Office。
        links: [{class: homepage, href: "https://www.libreoffice.org/"}]
        install: [{class: winget, content: "winget install -e --id TheDocumentFoundation.LibreOffice"}]
      - publisher: Google
        name: Google Workspace
        cost: freemium
        licenses: [Proprietary]
        comment: 線上的辦公室軟體套件，無需下載，可以多人協作、試試同步編輯。網路世界的 M$ Office。
        links: [{class: homepage, href: "https://workspace.google.com/"}]
      - publisher: KDE
        name: Okular
        cost: free
        licenses: [GPL-2.0-or-later, GFDL-1.3]
