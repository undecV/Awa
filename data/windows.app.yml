        links: [{class: homepage, href: "https://glabels.org/"}]
        install: [{class: winget, content: "winget install -e --id ibsorn.gLabels"}]
      - publisher: FreeCAD
        name: FreeCAD
        cost: free
        licenses: [LGPL-2.1-or-later]
        tags: [專業]
        comment: 計算機輔助設計軟體。3D CAD、MCAD、CAx、CAE 和 PLM 軟體。
        links: [{class: homepage, href: "https://www.freecad.org/"}]
        install: [{class: winget, content: "winget install -e --id FreeCAD.FreeCAD"}]
      - publisher: JosephFinney
        name: Text-Grab
