        links: [{class: homepage, href: "https://www.gnucash.org/"}]
        install: [{class: winget, content: "winget install -e --id GnuCash.GnuCash"}]
      - publisher: KDE
        name: KMyMoney
        cost: free
        licenses: [GPL-2.0-or-later]
        tags: [專業]
        comment: KDE 家族的個人財務管理軟體；帳戶、交易、預算、投資樣樣都要管，認真到記個生活費都像在做財報。
        links: [{class: homepage, href: "https://apps.kde.org/zh-tw/kmymoney/"}]
        install: [{class: winget, content: "winget install -e --id KDE.kmymoney"}]
      - publisher: 63BeetleSmurf
