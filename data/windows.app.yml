        install: [{class: winget, content: "winget install -e --id Scribus.Scribus"}]
      - publisher: Zint
        name: Zint
        cost: free
        licenses: [GPL-3.0]
        comment: 條碼生成器。支援見過和沒見過的、一維的和二維的、點的條的、方的長的各種各樣的條碼格式，例如 QR Code、Data Matrix、Code 128、Code 39、EAN 等。
        links: [{class: homepage, href: "https://zint.org.uk/"}]
