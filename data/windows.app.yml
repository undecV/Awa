        comment: 心智圖繪製軟體。Freemind 的後繼者，功能更強大但是畫風在上個世紀。
        links: [{class: homepage, href: "freeplane.sourceforge.net/"}]
        install: [{class: winget, content: "winget install -e --id Freeplane.Freeplane"}]
      - publisher: Microsoft
        name: OneNote
        cost: free
        licenses: [Proprietary]
        comment: 真正像實體筆記本概念的筆記軟體。Windows / Surface 生態中首選（笑）的筆記軟體。可以跨平臺同步。支援手寫，與其說是筆記，應該說是塗鴉本：）
        note: "雖然名義上是 M$ Office 的一員，但其實完全免費使用，不需要 Office 授權。"
        links: [{class: homepage, href: "https://simplenote.com/"}]
        install: [{class: winget, content: "winget install -e --id XPFFZHVGQWWLHB -s msstore"}]
      - publisher: Microsoft
        name: Journal
        cost: free
        licenses: [Proprietary]
        comment: Windows 上又一款手寫優先筆記軟體。主打手寫筆記的識別、搜尋、整理。Windows / Surface 生態中，二選（笑）的筆記軟體。
        note: 相比 Onenote 更一頁一頁紙的概念。[s]我的很多（要求手寫的）作業，很多都是用它完成的。[/s]
        links: [{class: homepage, href: "https://simplenote.com/"}]
        install: [{class: winget, content: "winget install -e --id 9N318R854RHH -s msstore"}]
      - publisher: Automattic
        name: Simplenote
        cost: free
        licenses: [GPL-2.0]
        tags: [服務]
        comment: 與 Wordpress 師出同門的，最純粹筆記（備忘錄）軟體，連圖片都不支援的那種純粹，跨平臺同步。
        links: [{class: homepage, href: "https://simplenote.com/"}]
        install: [{class: winget, content: "winget install -e --id Automattic.Simplenote"}]
      - publisher: Obsidian
        name: Obsidian
        cost: freemium
        licenses: [Proprietary]
        comment: 個人知識庫（Personal Knowledge Management, PKM）筆記軟體。雖然不開源但是本地優先，使用 Markdown。將多篇筆記連結起來，形成知識網絡。支援插件擴充功能。
        note: 提供付費的同步功能，但社群提供自建置的實時同步。
        links: [{class: homepage, href: "https://obsidian.md/"}]
        install: [{class: winget, content: "winget install -e --id Obsidian.Obsidian"}]
        contents:
        - publisher: vrtmrz
          name: obsidian-livesync
          id: obsidian-livesync
          cost: freemium
          licenses: [MIT]
          tags: [專業, 自建置]
          comment: 但社群提供的自建置的實時同步，需要 CouchDB 之類的伺服器。
          links: [{class: github, href: "https://github.com/vrtmrz/obsidian-livesync"}]
      - publisher: Logseq
        name: Logseq
        cost: freemium
        licenses: [AGPL-3.0]
        comment: 個人知識庫（Personal Knowledge Management, PKM）大綱式筆記軟體。不是一頁一頁的寫筆記，而是每天往大綱裡倒想法，再靠連結，讓他們自己長成知識網。
        note: 提供付費的同步功能。
        links: [{class: homepage, href: "https://logseq.com"}]
        install: [{class: winget, content: "winget install -e --id Logseq.Logseq"}]
      - publisher: AnyAssociation
        name: Anytype
        cost: freemium
        licenses: [Proprietary]
        comment: 本地優先、隱私優先的資訊工作台。把筆記、任務、人物、書籍等內容視為一個個可以定義類型與關係的物件，再彼此連結成自己的資訊空間；離線可用、端到端加密，也不必把全部資料寄居在別人的雲端。
        note: 其實是限制比較嚴格的開源軟體。
        links: [{class: homepage, href: "https://anytype.io/"}]
        install: [{class: winget, content: "winget install -e --id AnyAssociation.Anytype"}]
      - publisher: Joplin
        name: Joplin
        cost: free
        licenses: [AGPL-3.0-or-later]
        comment: 傳統筆記軟體，自由世界的 EverNote，可以自建置（Self-Host）跨平臺同步。
        links: [{class: homepage, href: "https://joplinapp.org/"}]
        install: [{class: winget, content: "winget install -e --id Joplin.Joplin"}]
      - publisher: TreeSheets
        name: TreeSheets
        cost: free
        licenses: [Zlib]
        tags: [專業]
        comment: 把試算表、心智圖和大綱編輯器揉成一種很難分類的資料整理工具：每個格子裡還能繼續塞格子，讓表格一路長成樹狀結構。自由度極高，也因此需要一點時間理解它到底想讓你怎麼思考。
        links: [{class: homepage, href: "https://strlen.com/treesheets/"}]
      - publisher: TriliumNext
        name: Trilium Notes
        cost: free
        licenses: [AGPL-3.0]
        comment: 個人知識庫（Personal Knowledge Management, PKM）筆記軟體。寫筆記像是寫百科全書。可以自建置（Self-Host）同步。
        links: [{class: github, href: "https://github.com/TriliumNext/Trilium"}]
        install: [{class: winget, content: "winget install -e --id TriliumNext.Notes"}]
      - publisher: Notion
        name: Notion
        cost: freemium
        licenses: [Proprietary]
        comment: 把文件、資料庫、Wiki、任務管理揉成一個巨大資訊工作台的代表作。所有內容都從 Block 開始，幾個 Block 疊成頁面，頁面又能變成資料庫的一筆資料；從讀書筆記一路蓋到公司 Wiki、專案管理甚至 CRM 都可以做。
        links: [{class: homepage, href: "https://www.notion.com/"}]
        install: [{class: winget, content: "winget install -e --id Notion.Notion"}]
      # - publisher: Zettlr
      #   name: Zettlr
      #   cost: free
      #   licenses: [GPL-3.0]
      #   comment: Markdown 筆記軟體，支援學術寫作。
      #   links: [{class: homepage, href: "https://www.zettlr.com/"}]
      #   install: [{class: winget, content: "winget install -e --id Zettlr.Zettlr"}]
      # - publisher: ToEverything
      #   name: AFFiNE
      #   cost: freemium
      #   licenses: [MIT]
      #   comment: Notion 平替。
      #   links: [{class: homepage, href: "https://affine.pro/"}]
      #   install: [{class: winget, content: "winget install -e --id ToEverything.AFFiNE"}]
  - name: GTD - 時間管理系統
